name: A task I want to understand
description: Help prioritize real user needs.
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to understand or change?
      description: Describe the program and the decision you need to make, in your own words.
    validations:
      required: true
  - type: textarea
    id: obstacle
    attributes:
      label: Where did you get stuck?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: A public or synthetic example (optional)
