name: Something is incorrect
description: An explanation, edit or comparison is wrong.
body:
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Smallest code example
      description: Use a synthetic example. Remove private code, tokens and personal data.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, inputs, version and environment
      description: Include browser or VS Code version and Pureobom version.
    validations:
      required: true
