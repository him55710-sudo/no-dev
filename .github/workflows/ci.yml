name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm extension:build
      - run: xvfb-run -a pnpm extension:test
        if: runner.os == 'Linux'
      - run: pnpm extension:test
        if: runner.os == 'Windows'
      - run: pnpm extension:package
      - uses: actions/upload-artifact@v4
        with:
          name: pureobom-${{ runner.os }}
          path: release/*.vsix
