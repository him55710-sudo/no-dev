name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --reporter=default --reporter=json --outputFile=test-results/unit-tests.json
      - run: pnpm build
      - run: pnpm extension:build
      - run: xvfb-run -a pnpm extension:test
        if: runner.os == 'Linux'
      - run: pnpm extension:test
        if: runner.os == 'Windows'
      - run: xvfb-run -a pnpm extension:design-test
        if: runner.os == 'Linux'
      - run: pnpm extension:design-test
        if: runner.os == 'Windows'
      - run: pnpm extension:package
      - run: xvfb-run -a pnpm extension:recovery-test
        if: runner.os == 'Linux'
      - run: pnpm extension:recovery-test
        if: runner.os == 'Windows'
      - run: pnpm release:package
      - run: pnpm release:check
      - uses: actions/upload-artifact@v4
        with:
          name: pureobom-${{ runner.os }}
          path: release/*.vsix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-${{ runner.os }}
          path: |
            test-results/unit-tests.json
            test-results/agent-host/observations.json
            test-results/verification-history/repaired.json
            test-results/verification-history/failed.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-recovery-${{ runner.os }}
          path: test-results/installed-recovery.json
          if-no-files-found: ignore
